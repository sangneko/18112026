<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Nhân Viên</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>HỒ SƠ NHÂN VIÊN</h1>
    </header>

    <div class="container">
        <aside class="sidebar">
            <ul>
                <li><a href="#" class="active">Hồ sơ nhân viên</a></li>
                <li><a href="#">Bảng nhân viên</a></li>
                <li><a href="#">Nhập thông tin</a></li>
            </ul>
        </aside>

        <main class="main-content">

            <section class="section">
                <h2>BẢNG NHÂN VIÊN</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Mã nhân viên</th>
                                <th>Họ và tên</th>
                                <th>Ngày sinh</th>
                                <th>Giới tính</th>
                                <th>Vị trí</th>
                                <th>Phòng ban</th>
                                <th>Điện thoại</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>NV01
                                <td>Nguyễn Thái Sang
                                <td>02/10/2005
                                <td>Nam
                                <td>Thực Tập Sinh
                                <td>Hành Chính Nhân Sự
                                <td>0902712130
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="section">
                <h2>FORM NHẬP THÔNG TIN</h2>
                <form action="#" method="post">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Mã nhân viên:</label>
                            <input type="text" placeholder="Nhập mã nhân viên">
                        </div>
                        <div class="form-group">
                            <label>Họ và tên:</label>
                            <input type="text" placeholder="Nhập họ và tên">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Ngày sinh:</label>
                            <input type="date">
                        </div>
                        <div class="form-group">
                            <label>Giới tính:</label>
                            <select>
                                <option>Nam</option>
                                <option>Nữ</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Vị trí:</label>
                            <input type="text" placeholder="Nhập vị trí">
                        </div>
                        <div class="form-group">
                            <label>Phòng ban:</label>
                            <input type="text" placeholder="Nhập phòng ban">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Điện thoại:</label>
                            <input type="tel" placeholder="Nhập số điện thoại">
                        </div>
                        <div class="form-group">
                            <label>Email:</label>
                            <input type="email" placeholder="Nhập địa chỉ email">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Lưu thông tin</button>
                        <button type="reset" class="btn btn-secondary">Nhập lại</button>
                    </div>
                </form>
            </section>

        </main>
    </div>

</body>
</html>
