<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Nhân Viên</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>HỒ SƠ NHÂN VIÊN</h1>
    </header>

    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <ul>
                <li><a href="#" class="active">Hồ sơ nhân viên</a></li>
                <li><a href="#tableSection">Bảng nhân viên</a></li>
                <li><a href="#formSection">Nhập thông tin</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Bảng nhân viên -->
            <section class="section" id="tableSection">
                <h2>BẢNG NHÂN VIÊN</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Mã nhân viên</th>
                                <th>Họ và tên</th>
                                <th>Ngày sinh</th>
                                <th>Giới tính</th>
                                <th>Vị trí</th>
                                <th>Phòng ban</th>
                                <th>Điện thoại</th>
                                <th style="text-align: center;">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="employeeTableBody"></tbody>
                    </table>
                </div>
            </section>

            <!-- Form nhập thông tin -->
            <section class="section" id="formSection">
                <h2>FORM NHẬP THÔNG TIN</h2>
                <form id="employeeForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Mã nhân viên:</label>
                            <input type="text" id="manv" placeholder="Nhập mã nhân viên" required>
                        </div>
                        <div class="form-group">
                            <label>Họ và tên:</label>
                            <input type="text" id="hoten" placeholder="Nhập họ và tên" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Ngày sinh:</label>
                            <input type="date" id="ngaysinh">
                        </div>
                        <div class="form-group">
                            <label>Giới tính:</label>
                            <select id="gioitinh">
                                <option value="Nam">Nam</option>
                                <option value="Nữ">Nữ</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Vị trí:</label>
                            <input type="text" id="vitri" placeholder="Nhập vị trí">
                        </div>
                        <div class="form-group">
                            <label>Phòng ban:</label>
                            <input type="text" id="phongban" placeholder="Nhập phòng ban">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Điện thoại:</label>
                            <input type="tel" id="dienthoai" placeholder="Nhập số điện thoại" required>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Lưu thông tin</button>
                        <button type="reset" class="btn btn-secondary">Nhập lại</button>
                    </div>
                </form>
            </section>

        </main>
    </div>

    <!-- Javascript -->
    <script src="js/main.js"></script>
</body>
</html>
