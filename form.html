<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhập Thông Tin Nhân Viên</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>HỒ SƠ NHÂN VIÊN</h1>
    </header>

    <div class="container">
        <!-- Sidebar Menu Điều Hướng -->
        <aside class="sidebar">
            <ul>
                <li><a href="index.html">Hồ sơ nhân viên</a></li>
                <li><a href="table.html">Bảng nhân viên</a></li>
                <li><a href="form.html" class="active">Nhập thông tin</a></li>
            </ul>
        </aside>

        <!-- Main Content (Trang 3: Nhập thông tin) -->
        <main class="main-content">
            <section class="section">
                <h2 id="formTitle">FORM NHẬP THÔNG TIN</h2>
                <form id="employeeForm">
                    <!-- Input ẩn lưu index khi chỉnh sửa (-1 là thêm mới) -->
                    <input type="hidden" id="editIndex" value="-1">

                    <div class="form-row">
                        <div class="form-group">
                            <label for="manv">Mã nhân viên: <span class="required">*</span></label>
                            <input type="text" id="manv" placeholder="Nhập mã nhân viên (VD: NV04)" required>
                            <small id="manvNote" class="form-hint"></small>
                        </div>
                        <div class="form-group">
                            <label for="hoten">Họ và tên: <span class="required">*</span></label>
                            <input type="text" id="hoten" placeholder="Nhập họ và tên" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="ngaysinh">Ngày sinh:</label>
                            <input type="date" id="ngaysinh">
                        </div>
                        <div class="form-group">
                            <label for="gioitinh">Giới tính:</label>
                            <select id="gioitinh">
                                <option value="Nam">Nam</option>
                                <option value="Nữ">Nữ</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="vitri">Vị trí:</label>
                            <input type="text" id="vitri" placeholder="Nhập vị trí công việc">
                        </div>
                        <div class="form-group">
                            <label for="phongban">Phòng ban:</label>
                            <input type="text" id="phongban" placeholder="Nhập phòng ban">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="dienthoai">Điện thoại: <span class="required">*</span></label>
                            <input type="tel" id="dienthoai" placeholder="Nhập số điện thoại (10 số)" required>
                        </div>
                        <div class="form-group">
                            <label for="hinhanh">Ảnh đại diện:</label>
                            <input type="file" id="hinhanh" accept="image/jpeg,image/png,image/gif,image/webp">
                            <small class="file-note">Định dạng: JPG, PNG, GIF, WEBP &bull; Tối đa: 2 MB</small>
                            <div id="imageError" class="file-error"></div>
                        </div>
                    </div>

                    <!-- Khung xem trước ảnh đính kèm -->
                    <div id="previewContainer" class="preview-container" style="display: none;">
                        <img id="imagePreview" src="" alt="Xem trước ảnh">
                        <div class="preview-details">
                            <span class="preview-name" id="previewFileName"></span>
                            <span class="preview-size" id="previewFileSize"></span>
                            <button type="button" id="btnRemoveImage" class="btn-remove-image">Xóa ảnh</button>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="btnSubmit" class="btn btn-primary">Lưu thông tin</button>
                        <a href="table.html" id="btnCancelEdit" class="btn btn-warning" style="display: none; text-decoration: none; text-align: center;">Hủy sửa</a>
                        <button type="reset" id="btnReset" class="btn btn-secondary">Nhập lại</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <!-- Modal xem ảnh lớn -->
    <div id="imageModal" class="image-modal" style="display: none;">
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-content">
            <button type="button" class="modal-close" id="modalClose" aria-label="Đóng">&times;</button>
            <img id="modalImg" src="" alt="Ảnh nhân viên">
            <div id="modalCaption" class="modal-caption"></div>
        </div>
    </div>

    <!-- Javascript -->
    <script src="js/main.js"></script>
</body>
</html>
